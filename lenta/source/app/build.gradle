plugins { id 'com.android.application' }
android {
    namespace 'uz.lenta.app'
    compileSdk 34
    defaultConfig {
        applicationId 'uz.lenta.app'
        minSdk 24
        targetSdk 34
        versionCode 14
        versionName '5.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    signingConfigs {
        rel {
            storeFile file('../lenta.keystore')
            storePassword System.getenv('LENTA_KS_PASS') ?: ''
            keyAlias 'lenta'
            keyPassword System.getenv('LENTA_KS_PASS') ?: ''
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.rel }
    }
    packaging { jniLibs { useLegacyPackaging true } }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation files('libs/tor-android-0.4.8.21.aar', 'libs/IPtProxy-5.9.0.aar')
    implementation 'info.guardianproject:jtorctl:0.4.5.7'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
}
